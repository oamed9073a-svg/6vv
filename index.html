<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Змейка</title>
<style>
  :root {
    --bg: #0f1020;
    --bg2: #1a1b3a;
    --accent: #6ee7ff;
    --accent2: #ff6ec7;
    --snake: #7cf57c;
    --snake-head: #b4ffb4;
    --food: #ff5c8a;
    --text: #e8e8ff;
    --muted: #8a8ab0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg));
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 44px);
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 2px;
  }
  .hud {
    display: flex;
    gap: 24px;
    font-size: 18px;
    letter-spacing: 1px;
  }
  .hud span b { color: var(--accent); }
  .hud .best b { color: var(--accent2); }
  .board-wrap {
    position: relative;
    border-radius: 14px;
    padding: 10px;
    background: linear-gradient(135deg, rgba(110,231,255,0.15), rgba(255,110,199,0.15));
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
  }
  canvas {
    display: block;
    background: #07081a;
    border-radius: 8px;
    image-rendering: pixelated;
    max-width: 90vw;
    max-height: 70vh;
  }
  .overlay {
    position: absolute;
    inset: 10px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(7,8,26,0.85);
    backdrop-filter: blur(4px);
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    margin: 0;
    font-size: 32px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .overlay p { margin: 0; color: var(--muted); }
  button {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    color: #0b0c20;
    padding: 12px 28px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform .1s, box-shadow .2s;
    box-shadow: 0 4px 20px rgba(110,231,255,0.3);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(255,110,199,0.4); }
  button:active { transform: translateY(0); }
  .help {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    max-width: 480px;
  }
  kbd {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    font-family: inherit;
    font-size: 12px;
    margin: 0 2px;
  }
  .touch-controls {
    display: none;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 6px;
    margin-top: 8px;
  }
  .touch-controls button {
    padding: 0;
    border-radius: 12px;
    font-size: 24px;
    box-shadow: none;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .touch-controls .up { grid-column: 2; grid-row: 1; }
  .touch-controls .left { grid-column: 1; grid-row: 2; }
  .touch-controls .right { grid-column: 3; grid-row: 2; }
  .touch-controls .down { grid-column: 2; grid-row: 3; }
  @media (hover: none) and (pointer: coarse) {
    .touch-controls { display: grid; }
    .help { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>ЗМЕЙКА</h1>
  <div class="hud">
    <span>Счёт: <b id="score">0</b></span>
    <span class="best">Рекорд: <b id="best">0</b></span>
  </div>
  <div class="board-wrap">
    <canvas id="board" width="480" height="480"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title">Готов?</h2>
      <p id="overlay-text">Управление: стрелки или WASD. Пробел — пауза.</p>
      <button id="start-btn">Играть</button>
    </div>
  </div>
  <div class="touch-controls" id="touch">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◄</button>
    <button class="right" data-dir="right">►</button>
    <button class="down" data-dir="down">▼</button>
  </div>
  <p class="help">
    Управление: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> или <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>.
    Пауза — <kbd>Space</kbd>. Перезапуск — <kbd>R</kbd>.
  </p>
</div>

<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const startBtn = document.getElementById('start-btn');

  const COLS = 24, ROWS = 24;
  const CELL = canvas.width / COLS;

  let snake, dir, nextDir, food, score, best, alive, paused, tickMs, lastTick, started;
  let pulse = 0;

  best = parseInt(localStorage.getItem('snake-best') || '0', 10);
  bestEl.textContent = best;

  function reset() {
    snake = [
      { x: 10, y: 12 },
      { x: 9, y: 12 },
      { x: 8, y: 12 },
    ];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    tickMs = 120;
    alive = true;
    paused = false;
    placeFood();
    updateHud();
  }

  function placeFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS),
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) {
        food = f;
        return;
      }
    }
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function step() {
    if (!alive || paused) return;

    // apply queued direction (prevent 180° reversal)
    if ((nextDir.x !== -dir.x || nextDir.y !== -dir.y) &&
        (nextDir.x !== dir.x || nextDir.y !== dir.y)) {
      dir = nextDir;
    }

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // walls
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }
    // self
    if (snake.some((s, i) => i < snake.length - 1 && s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      if (score > best) {
        best = score;
        localStorage.setItem('snake-best', String(best));
      }
      updateHud();
      // speed up slightly
      tickMs = Math.max(55, tickMs - 2);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    // background
    ctx.fillStyle = '#07081a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // food (pulsing)
    pulse += 0.12;
    const fr = CELL / 2 * (0.85 + Math.sin(pulse) * 0.12);
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    const grad = ctx.createRadialGradient(fx, fy, 1, fx, fy, fr * 1.6);
    grad.addColorStop(0, '#ffd0e1');
    grad.addColorStop(0.5, '#ff5c8a');
    grad.addColorStop(1, 'rgba(255,92,138,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(fx, fy, fr * 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff5c8a';
    ctx.beginPath();
    ctx.arc(fx, fy, fr * 0.55, 0, Math.PI * 2);
    ctx.fill();

    // snake
    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const isHead = i === 0;
      const x = seg.x * CELL, y = seg.y * CELL;
      const pad = 2;
      ctx.fillStyle = isHead ? '#b4ffb4' : `hsl(${130 + i * 2}, 70%, ${60 - Math.min(i, 25)}%)`;
      roundRect(ctx, x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, 5);
      ctx.fill();

      if (isHead) {
        // eyes
        ctx.fillStyle = '#0b1228';
        const eyeSize = CELL * 0.13;
        const ox = dir.x, oy = dir.y;
        const cx = x + CELL / 2, cy = y + CELL / 2;
        const ex1 = cx + ox * CELL * 0.18 + (-oy) * CELL * 0.2;
        const ey1 = cy + oy * CELL * 0.18 + (ox) * CELL * 0.2;
        const ex2 = cx + ox * CELL * 0.18 - (-oy) * CELL * 0.2;
        const ey2 = cy + oy * CELL * 0.18 - (ox) * CELL * 0.2;
        ctx.beginPath(); ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function gameOver() {
    alive = false;
    overlayTitle.textContent = 'Игра окончена';
    overlayText.textContent = `Счёт: ${score}` + (score === best && score > 0 ? ' — новый рекорд!' : '');
    startBtn.textContent = 'Сыграть ещё';
    overlay.classList.remove('hidden');
  }

  function loop(ts) {
    if (!lastTick) lastTick = ts;
    if (alive && !paused && ts - lastTick >= tickMs) {
      lastTick = ts;
      step();
    }
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    reset();
    overlay.classList.add('hidden');
    lastTick = 0;
    started = true;
  }

  function togglePause() {
    if (!started || !alive) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = 'Пауза';
      overlayText.textContent = 'Нажми «Продолжить» или Space';
      startBtn.textContent = 'Продолжить';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
    }
  }

  const keyMap = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 },
    a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
    W: { x: 0, y: -1 }, S: { x: 0, y: 1 },
    A: { x: -1, y: 0 }, D: { x: 1, y: 0 },
    ц: { x: 0, y: -1 }, ы: { x: 0, y: 1 },
    ф: { x: -1, y: 0 }, в: { x: 1, y: 0 },
  };

  window.addEventListener('keydown', e => {
    if (keyMap[e.key]) {
      e.preventDefault();
      nextDir = keyMap[e.key];
      return;
    }
    if (e.key === ' ') {
      e.preventDefault();
      togglePause();
    } else if (e.key === 'r' || e.key === 'R') {
      startGame();
    }
  });

  startBtn.addEventListener('click', () => {
    if (paused && alive) {
      togglePause();
    } else {
      startGame();
    }
  });

  document.getElementById('touch').addEventListener('click', e => {
    const dirName = e.target.closest('button')?.dataset.dir;
    if (!dirName) return;
    const map = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
    nextDir = map[dirName];
  });

  // swipe controls
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      nextDir = { x: dx > 0 ? 1 : -1, y: 0 };
    } else {
      nextDir = { x: 0, y: dy > 0 ? 1 : -1 };
    }
    touchStart = null;
  });

  reset();
  alive = false;
  started = false;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
